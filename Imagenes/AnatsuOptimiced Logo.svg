<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="100%" height="100%">
  <defs>
    <!-- Gradiente de atardecer cálido estilo Minecraft -->
    <linearGradient id="atardecer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="40%" stop-color="#c2410c" />
      <stop offset="70%" stop-color="#f97316" />
      <stop offset="90%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    
    <!-- Sombra para dar profundidad y contraste -->
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Fondo: Cielo de atardecer -->
  <rect width="200" height="180" fill="url(#atardecer)" />
  
  <!-- Sol cuadrado estilo Minecraft -->
  <rect x="75" y="40" width="50" height="50" fill="#fef08a" opacity="0.9" />

  <!-- Montañas pixeladas abajo -->
  <path d="M 0 150 L 50 120 L 90 140 L 140 105 L 180 135 L 200 120 L 200 180 L 0 180 Z" fill="#292524" />

  <!-- Silueta de la letra A en BLANCO con contorno y sombra para máximo contraste -->
  <path d="M 60 10 L 140 10 L 140 30 L 160 30 L 160 50 L 180 50 L 180 130 L 160 130 L 160 150 L 140 150 L 140 170 L 112 170 L 112 80 L 88 80 L 88 170 L 60 170 L 60 150 L 40 150 L 40 130 L 20 130 L 20 50 L 40 50 L 40 30 L 60 30 Z" 
        fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round" filter="url(#sombra)" />
</svg>
